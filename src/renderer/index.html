<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剪贴板历史</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="搜索剪贴板历史..."
        autocomplete="off"
      />
      <button id="clearSearchBtn" class="clear-search-btn" title="清除搜索">✕</button>
    </div>
    <button id="alwaysOnTopBtn" class="settings-btn pin-window-btn" title="窗口置顶">📌</button>
    <button id="settingsBtn" class="settings-btn" title="设置">⚙</button>
  </div>

  <!-- 主内容区 -->
  <div id="mainContent" class="main-content">

    <!-- 空状态 -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📋</div>
      <h2 class="empty-title">暂无剪贴板历史</h2>
      <p class="empty-subtitle">开始复制文字或截图，内容将自动出现在这里</p>
    </div>

    <!-- 搜索无结果 -->
    <div id="noResultsState" class="empty-state hidden">
      <div class="empty-icon">🔍</div>
      <h2 class="empty-title">未找到相关内容</h2>
      <p class="empty-subtitle" id="noResultsMsg">试试其他关键词</p>
    </div>

    <!-- 列表内容 -->
    <div id="listContent" class="list-content hidden">

      <!-- 已置顶区域 -->
      <div id="pinnedSection" class="section hidden">
        <div class="section-header">
          <span>📌 已置顶</span>
          <span class="section-count" id="pinnedCount">0</span>
        </div>
        <div id="pinnedList" class="item-list"></div>
      </div>

      <!-- 时间分组区域 -->
      <div id="recentSection" class="section hidden">
        <div id="recentList"></div>
      </div>

      <!-- 加载更多 -->
      <button id="loadMoreBtn" class="load-more-btn hidden">加载更多...</button>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar">
    <span id="statusText">就绪</span>
  </div>

  <!-- 图片预览弹窗 -->
  <div id="imagePreview" class="image-preview-overlay hidden">
    <div class="image-preview-close" id="imagePreviewClose">✕</div>
    <img id="imagePreviewImg" src="" alt="预览" />
    <div class="image-preview-info" id="imagePreviewInfo"></div>
  </div>

  <!-- 文字全文弹窗 -->
  <div id="textPreview" class="text-preview-overlay hidden">
    <div class="text-preview-header">
      <span>全文查看</span>
      <button id="textPreviewCopy" class="text-preview-copy">📋 复制全部</button>
      <button id="textPreviewClose" class="settings-close-btn">✕</button>
    </div>
    <textarea id="textPreviewContent" class="text-preview-content" readonly></textarea>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast">已复制到剪贴板</div>

  <!-- 设置面板（叠加层） -->
  <div id="settingsPanel" class="settings-overlay hidden">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <button id="settingsCloseBtn" class="settings-close-btn">✕</button>
    </div>
    <div class="settings-body">
      <!-- 保存期限 -->
      <div class="setting-group">
        <label class="setting-label">保存期限</label>
        <p class="setting-desc">超过期限且未置顶的记录将被自动清理</p>
        <input type="range" id="retentionSlider" class="range-slider" min="1" max="90" value="30" />
        <div class="range-value" id="retentionValue">30 天</div>
      </div>

      <!-- 最大条目数 -->
      <div class="setting-group">
        <label class="setting-label">最大条目数</label>
        <p class="setting-desc">超出后自动删除最旧的非置顶记录</p>
        <select id="maxItemsSelect" class="setting-select">
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000" selected>1000</option>
          <option value="5000">5000</option>
          <option value="10000">10000</option>
        </select>
      </div>

      <!-- 全局快捷键 -->
      <div class="setting-group">
        <label class="setting-label">全局快捷键</label>
        <p class="setting-desc">按此快捷键随时唤出/隐藏剪贴板窗口</p>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="hotkeyDisplay" style="font-family: monospace; padding: 4px 10px; background: var(--bg-input); border-radius: 4px;">Ctrl+Shift+V</span>
          <button id="recordHotkeyBtn" class="hotkey-record-btn">修改</button>
        </div>
      </div>

      <!-- 开机自启 -->
      <div class="setting-row">
        <div>
          <span class="setting-label">开机自启</span>
          <p class="setting-desc">系统启动时自动运行，静默在托盘</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="autoStartToggle" checked />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- 半透明模式 -->
      <div class="setting-row">
        <div>
          <span class="setting-label">半透明模式</span>
          <p class="setting-desc">调节窗口整体透明度，不影响功能使用</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="translucentToggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- 透明度（仅半透明模式有效） -->
      <div class="setting-group" id="opacityGroup">
        <label class="setting-label">透明度</label>
        <p class="setting-desc">半透明模式下的窗口透明度</p>
        <input type="range" id="opacitySlider" class="range-slider" min="30" max="80" value="30" />
        <div class="range-value" id="opacityValue">85%</div>
      </div>

      <!-- 清空历史 -->
      <div class="setting-group" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);">
        <button id="clearAllBtn" class="clear-all-btn">🗑 清空全部历史</button>
        <p class="setting-desc" style="margin-top: 6px;">删除所有非置顶记录及图片文件，此操作不可撤销</p>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
