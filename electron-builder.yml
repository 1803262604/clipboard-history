appId: com.clipboard-history.app
productName: Clipboard History
copyright: Copyright 2026

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/*.{md,ts,map,license}"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/test/**"
  - "!node_modules/@tesseract.js-data/*/4.0.0/**/*"
  - "!node_modules/tesseract.js-core/*.wasm.js"

asar: true
asarUnpack:
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/regenerator-runtime/**/*
  - node_modules/is-url/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/bmp-js/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clipboard History
  deleteAppDataOnUninstall: false
